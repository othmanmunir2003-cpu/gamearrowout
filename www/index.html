<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}</style>
<title>Arrow Out</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen transit signboard. Header (level + hearts), square board of arrows, two actions, ad banner slot at the bottom. */
:root {
  --bg: #e7edf0;
  --fg: #10202a;
  --muted: #55656f;
  --line: #c9d4da;
  --surface: #f8fafb;
  --board: #17303b;
  --tile: #38596a;
  --arrow: #f2f6f8;
  --accent: #ffb300;
  --accent-ink: #1a1300;
  --alert: #ff6b6b;
  --heart: #e5484d;
  --c-up: #f2f6f8;
  --c-right: #8fd8ff;
  --c-down: #ffd166;
  --c-left: #a8e6b8;
  --font-body: "Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --font-display: "Barlow Condensed", "Arial Narrow", "Cairo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1217; --fg: #e4ecf0; --muted: #8ea0ab; --line: #25343d; --surface: #152229;
    --board: #17303b; --tile: #2c4856; --arrow: #f2f6f8; --accent: #ffb300; --accent-ink: #1a1300;
    --alert: #ff6b6b; --heart: #e5484d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1217; --fg: #e4ecf0; --muted: #8ea0ab; --line: #25343d; --surface: #152229;
  --board: #17303b; --tile: #2c4856; --arrow: #f2f6f8; --accent: #ffb300; --accent-ink: #1a1300;
  --alert: #ff6b6b; --heart: #e5484d;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow-x: hidden; }
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-x: hidden;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .04em; text-transform: uppercase; line-height: 1; direction: ltr; }
.hearts { display: flex; gap: 4px; direction: ltr; }
.hearts svg { width: 24px; height: 24px; fill: var(--heart); transition: opacity .2s, transform .2s; }
.hearts svg.lost { opacity: .22; transform: scale(.82); }

.meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.level { font-weight: 700; font-size: 20px; }
.level b { font-family: var(--font-display); font-size: 28px; font-variant-numeric: tabular-nums; margin-inline-start: 4px; }
.count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

.stage { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.home-stage { container-type: size; }
.board {
  --cols: 5;
  --rows: 7;
  position: relative;
  width: min(100cqw, 560px, calc(100cqh * var(--cols) / var(--rows)));
  aspect-ratio: var(--cols) / var(--rows);
  direction: ltr;
  background-color: var(--board);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--arrow) 14%, transparent);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.bsvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.dot { fill: var(--tile); }
.arr { color: var(--c-up); cursor: pointer; animation: appear .32s ease backwards; }
.arr[data-dir="up"] { color: var(--c-up); }
.arr[data-dir="right"] { color: var(--c-right); }
.arr[data-dir="down"] { color: var(--c-down); }
.arr[data-dir="left"] { color: var(--c-left); }
.arr .bd { fill: none; stroke: currentColor; stroke-width: var(--lw, .13); stroke-linecap: round; stroke-linejoin: round; }
.arr .hd { fill: currentColor; stroke: currentColor; stroke-width: .04; stroke-linejoin: round; }
.arr .hit { fill: none; stroke: transparent; stroke-width: .8; stroke-linecap: round; stroke-linejoin: round; pointer-events: stroke; }
.arr:focus { outline: none; }
.arr:focus-visible .bd { stroke-width: calc(var(--lw, .13) * 1.5); }
.arr.out { pointer-events: none; filter: drop-shadow(0 0 4px currentColor); transition: opacity 0.15s ease; }
.arr.out .hit { display: none; }
.arr.shake { animation: shake .42s cubic-bezier(.3, 1.4, .5, 1); }
.arr.blocked { color: var(--alert); filter: drop-shadow(0 0 6px var(--alert)); z-index: 10; transition: color .2s, filter .2s; }
.arr.hint { animation: hintp .7s ease-in-out infinite alternate; }
.arr.hint .bd { opacity: 0; }
.arr .hg path { fill: none; stroke-width: calc(var(--lw, .13) * 1.7); stroke-linecap: round; stroke-linejoin: round; }
.arr .tr { fill: none; stroke: currentColor; stroke-width: calc(var(--lw, .13) * 3.5); stroke-opacity: .5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; filter: blur(0.6px); }
@keyframes appear { from { opacity: 0; } }
@keyframes shake { 0% { transform: translate(0, 0); } 20% { transform: translate(calc(var(--bx, 0) * 3px), calc(var(--by, 0) * 3px)); } 40% { transform: translate(calc(var(--bx, 0) * -3px), calc(var(--by, 0) * -3px)); } 60% { transform: translate(calc(var(--bx, 0) * 2px), calc(var(--by, 0) * 2px)); } 80% { transform: translate(calc(var(--bx, 0) * -1px), calc(var(--by, 0) * -1px)); } 100% { transform: translate(0, 0); } }
@keyframes hintp { from { opacity: 1; } to { opacity: .4; } }

.tip { margin: 0; text-align: center; color: var(--muted); font-size: 13px; }
.actions { display: flex; gap: 10px; }
.btn {
  flex: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px;
  padding: 8px 16px;
  font: 700 16px/1.2 var(--font-body);
  color: var(--fg);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 5px; border: 1.5px solid currentColor; opacity: .75; }

.banner {
  min-height: 50px;
  display: grid; place-items: center;
  border: 1.5px dashed var(--line);
  border-radius: 10px;
  color: var(--muted);
  font-size: 12px;
}

.modal {
  position: fixed; inset: 0; z-index: 20;
  display: grid; place-items: center;
  background: rgba(5, 10, 14, .6);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet {
  width: min(100%, 340px);
  background: var(--surface);
  color: var(--fg);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: 22px;
  display: flex; flex-direction: column; gap: 14px;
}
.sheet h2 { margin: 0; font-size: 22px; line-height: 1.3; text-wrap: balance; }
.sheet .body { color: var(--muted); }
.sheet .acts { display: flex; flex-direction: column; gap: 10px; }
.adbox { display: grid; place-items: center; text-align: center; gap: 4px; min-height: 120px; padding: 14px; border: 1.5px dashed var(--line); border-radius: 12px; color: var(--fg); }
.adbox small { color: var(--muted); font-size: 12px; }

.brandrow { display: flex; align-items: center; gap: 10px; }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; padding: 0; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; }
.iconbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.home { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; overflow: hidden; }
.home { position: relative; isolation: isolate; }
.home::before { content: ""; position: absolute; z-index: -1; left: -30%; right: -30%; top: 4%; height: 56%; background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 24%, transparent), transparent); pointer-events: none; }
.home-top { align-items: center; justify-content: space-between; }
.home-stage { flex: 1; min-height: 0; display: grid; place-items: center; }
.home-stage .board { box-shadow: 0 18px 50px color-mix(in srgb, var(--accent) 22%, transparent), inset 0 0 0 3px color-mix(in srgb, var(--arrow) 14%, transparent); }
.stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.stat { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 99px; background: var(--surface); font-size: 14px; color: var(--muted); }
.stat b { font: 700 20px/1 var(--font-display); color: var(--fg); font-variant-numeric: tabular-nums; }
.stat svg { width: 18px; height: 18px; fill: var(--accent); stroke: none; }
.home-copy { animation: rise .6s ease .1s backwards; }
.home-actions { animation: rise .6s ease .25s backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@media (prefers-reduced-motion: reduce) { .home-copy, .home-actions { animation: none; } }
.board.pv { width: min(100cqw, 340px, calc(100cqh * var(--cols) / var(--rows))); }
.pv .arr { cursor: default; pointer-events: none; }
.home-copy { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.logo { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(54px, 17vw, 78px); line-height: .95; letter-spacing: .03em; text-transform: uppercase; direction: ltr; }
.logo span { color: var(--accent); }
.tagline { margin: 0; color: var(--muted); text-wrap: balance; }
.home-actions { display: flex; flex-direction: column; gap: 10px; padding-bottom: 4px; }
.home-actions .row { display: flex; gap: 8px; }
.home-actions .row .btn { padding-inline: 8px; font-size: 15px; }
.btn.big { min-height: 60px; font-size: 21px; border-radius: 14px; }
.lvgrid { direction: ltr; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 42dvh; overflow-y: auto; padding: 2px; }
.lv { min-height: 48px; font: 700 22px/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; }
.lv.cur { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.lv:disabled { opacity: .4; cursor: default; }
.lv:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.how { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 8px; }

/* Board themes unlocked by progress */
/* Theme colors are applied from the THEMES list in the script. Glow is a CSS-only extra. */
body[data-board="classic"] .board { background: transparent; box-shadow: none; border-radius: 0; }
body[data-board="classic"] .dot { fill: transparent; }
body[data-board="classic"] .board.pv { box-shadow: inset 0 0 0 2px var(--line); border-radius: 14px; }
body[data-board="neon"] .arr,
body[data-board="gold"] .arr,
body[data-board="volcano"] .arr { filter: drop-shadow(0 0 .08px currentColor); }
.sheet.wide { width: min(100%, 420px); }
.tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-height: 52dvh; overflow-y: auto; padding: 2px; text-align: start; }
.tcard { display: flex; flex-direction: column; gap: 8px; padding: 8px; font: inherit; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; }
.tcard.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.tcard:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tprev { display: flex; align-items: center; justify-content: center; gap: 4px; direction: ltr; aspect-ratio: 16 / 9; border-radius: 8px; background-color: var(--board); background-image: radial-gradient(circle, var(--tile) 1.4px, transparent 2px); background-size: 14px 14px; }
.tprev svg { width: 24%; height: auto; max-height: 70%; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.tprev.glow svg { filter: drop-shadow(0 0 3px currentColor); }
.tname { font-weight: 700; font-size: 14px; line-height: 1.2; }
.tstate { display: flex; align-items: center; gap: 6px; min-height: 22px; font-size: 13px; color: var(--muted); }
.tstate .chip { color: var(--fg); }
.tstate.own { color: var(--accent); font-weight: 700; }


.hud { display: flex; align-items: center; gap: 10px; }
.prog { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s ease; }
.particle { position: absolute; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; z-index: 30; }
.pop { position: absolute; z-index: 30; pointer-events: none; font: 700 34px/1 var(--font-display); color: var(--accent); text-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
.stars { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; direction: ltr; }
.stars svg { width: 42px; height: 42px; fill: none; stroke: var(--line); stroke-width: 1.6; stroke-linejoin: round; }
.stars svg.on { fill: var(--accent); stroke: var(--accent); animation: starpop .5s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: var(--dl, 0s); }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
.unlock { margin-top: 8px; color: var(--accent); font-weight: 700; }

.coins { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font: 700 20px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.coins svg { width: 22px; height: 22px; flex: none; }
.coins.bump { animation: bump .45s ease; }
@keyframes bump { 40% { transform: scale(1.2); } }
.coins:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.home-top { display: flex; align-items: center; justify-content: space-between; }
.reward { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; color: var(--fg); }
.reward svg { width: 22px; height: 22px; flex: none; }
.reward b { font: 700 24px/1 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.reward span { font-size: 14px; color: var(--muted); }
.chip.cost { display: inline-flex; align-items: center; gap: 4px; }
.chip.cost svg { width: 14px; height: 14px; }
.how { text-align: start; }
.sheet .body .how { margin-top: 12px; }
@media (max-width: 440px) { .top .brand { display: none; } }
#atmo { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background: radial-gradient(70% 45% at 15% 8%, hsl(var(--h1, 30) 75% 58% / .20), transparent 70%), radial-gradient(60% 45% at 92% 92%, hsl(var(--h2, 200) 70% 55% / .16), transparent 70%); }
#atmo i { position: absolute; bottom: -60px; opacity: .045; color: var(--fg); animation: drift linear infinite; }
#atmo svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
@keyframes drift { to { transform: translateY(-115dvh) rotate(var(--rot, 0deg)); } }
.home, .app { position: relative; z-index: 1; }
.world { font-size: 13px; font-weight: 600; color: var(--muted); margin-inline-start: 6px; }
.chipbtn { font: 700 13px/1 var(--font-display); padding: 6px 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 99px; cursor: pointer; }
.zoomreset { position: absolute; z-index: 5; top: 4px; inset-inline-start: 4px; }
.stage { position: relative; }
.level, .count { white-space: nowrap; }
.meta { gap: 8px; }
.chipbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.toast { position: fixed; z-index: 30; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 64px); padding: 10px 18px; border-radius: 99px; background: var(--fg); color: var(--bg); font-weight: 700; white-space: nowrap; pointer-events: none; animation: toast 2.5s ease forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -6px); } }
.ring { position: absolute; width: 34px; height: 34px; border: 2px solid; border-radius: 50%; pointer-events: none; z-index: 29; }
@media (prefers-reduced-motion: reduce) { #atmo i { animation: none; bottom: 20%; } .toast { animation-duration: 3s; } }
@media (max-height: 720px) { .tip, .banner { display: none; } .app { gap: 10px; } }
@media (prefers-reduced-motion: reduce) { .coins.bump { animation: none; } }
.sheet .body { text-align: center; }
.themes-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.themes { display: flex; gap: 10px; }
.swatch { width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; color: #fff; font: 700 15px/1 var(--font-display); text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
.swatch.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.swatch.locked { opacity: .5; cursor: default; }
.swatch:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.lv { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.lv small { font: 12px/1 var(--font-body); color: var(--accent); letter-spacing: 1px; min-height: 12px; }
@media (prefers-reduced-motion: reduce) {
  .arr { animation: none; }
  .stars svg.on { animation: none; }
  .prog i { transition: none; }
}

</style>

<div id="atmo" aria-hidden="true"></div>
<div class="toast" id="toast" hidden></div>

<section class="home" id="home" dir="rtl">
  <div class="home-top">
    <button class="coins" id="coinsHome" type="button" aria-label="العملات"></button>
    <button class="iconbtn" id="muteBtn" type="button"></button>
  </div>
  <div class="home-stage">
    <div class="board pv" id="pvBoard" aria-hidden="true"></div>
  </div>
  <div class="home-copy">
    <h1 class="logo">Arrow <span>Out</span></h1>

    <button class="btn primary big" id="playBtn" type="button">ابدأ اللعب</button>
    <div class="row">
      <button class="btn" id="levelsBtn" type="button">المراحل</button>
      <button class="btn" id="themesBtn" type="button">الثيمات</button>
      <button class="btn" id="shopHomeBtn" type="button">المتجر</button>
      <button class="btn" id="howBtn" type="button">طريقة اللعب</button>
    </div>
  </div>
</section>

<div class="app" dir="rtl" id="game" hidden>
  <header class="top">
    <div class="brandrow">
      <button class="iconbtn" id="homeBtn" type="button" aria-label="الرئيسية"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h11v-9"/></svg></button>
      <button class="iconbtn" id="shopBtn" type="button" aria-label="المتجر"><svg viewBox="0 0 24 24"><path d="M3 3h2l3 9h10l3-9h2M16 16a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM7 16a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/></svg></button>
      <div class="brand">Arrow Out</div>
    </div>
    <div class="hud">
      <button class="coins" id="coinsBtn" type="button" aria-label="العملات"></button>
      <button class="iconbtn" id="fsBtn" type="button" aria-label="ملء الشاشة" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="iconbtn" id="muteBtn2" type="button"></button>
      <div class="hearts" id="hearts" aria-label="المحاولات المتبقية"></div>
    </div>
  </header>

  <div class="meta">
    <div class="level">المرحلة <b id="lvl">1</b><span class="world" id="worldName"></span></div>
    <div class="count" id="count"></div>
  </div>
  <div class="prog" aria-hidden="true"><i id="progFill"></i></div>

  <main class="stage">
    <button class="chipbtn zoomreset" id="zoomReset" type="button" hidden aria-label="إعادة حجم اللوحة">1×</button>

      if (g.type === 'pinch' && k.length >= 2) {
        var a = ptrs[k[0]], c = ptrs[k[1]], mx = (a[0] + c[0]) / 2, my = (a[1] + c[1]) / 2;
        view.s = Math.min(4, Math.max(1, g.s0 * (Math.hypot(a[0] - c[0], a[1] - c[1]) / g.d0)));
        view.x = mx - g.px * view.s; view.y = my - g.py * view.s;
        swallow = true; applyView();
      } else if (g.type === 'pan') {
        var p = ptrs[k[0]], dx = p[0] - g.x0, dy = p[1] - g.y0;
        if (!g.moved && Math.hypot(dx, dy) > 7) g.moved = true;
        if (g.moved && view.s > 1) { swallow = true; view.x = g.vx + dx; view.y = g.vy + dy; applyView(); }
      }
    });
    function up(e) {
      if (!ptrs[e.pointerId]) return;
      delete ptrs[e.pointerId];
      startGesture();
      if (!Object.keys(ptrs).length) { swTimer = setTimeout(function () { swallow = false; }, 80); }
    }
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    b.addEventListener('click', function (e) { if (swallow) { e.stopPropagation(); e.preventDefault(); } }, true);
    b.addEventListener('wheel', function (e) {
      e.preventDefault();
      var p = pos(e), ns = Math.min(4, Math.max(1, view.s * Math.exp(-e.deltaY * 0.0016)));
      var px = (p[0] - view.x) / view.s, py = (p[1] - view.y) / view.s;
      view.s = ns; view.x = p[0] - px * ns; view.y = p[1] - py * ns; applyView();
    }, { passive: false });
    window.addEventListener('resize', applyView);
    $('zoomReset').addEventListener('click', resetView);
  })();

  // ---- Worlds: every 10 levels the background mood changes ----
  var WORLDS = [
    { n: 'البداية', h: 30, h2: 200 }, { n: 'الغروب الذهبي', h: 20, h2: 340 }, { n: 'الغابة', h: 140, h2: 60 },
    { n: 'المحيط', h: 200, h2: 170 }, { n: 'الكريستال', h: 270, h2: 200 }, { n: 'الصحراء', h: 38, h2: 15 },
    { n: 'الشفق', h: 310, h2: 260 }, { n: 'الجبل', h: 215, h2: 150 }, { n: 'النجوم', h: 250, h2: 300 }, { n: 'الأسطورة', h: 0, h2: 40 }
  ];
  function worldOf(lv) { return WORLDS[Math.floor((lv - 1) / 10) % WORLDS.length]; }
  function setAtmo(lv) { var w = worldOf(lv), a = $('atmo'); a.style.setProperty('--h1', w.h); a.style.setProperty('--h2', w.h2); }
  (function () {
    var a = $('atmo');
    for (var i = 0; i < 9; i++) {
      var e = document.createElement('i'), sz = 22 + Math.random() * 26;
      e.style.left = (4 + i * 11 + Math.random() * 5) + '%';
      e.style.width = sz + 'px'; e.style.height = sz + 'px';
      e.style.animationDuration = (26 + Math.random() * 20) + 's';
      e.style.animationDelay = (-Math.random() * 40) + 's';
      e.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
      e.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20V4M5.5 10.5 12 4l6.5 6.5"/></svg>';
      a.appendChild(e);
    }
  })();
  var toastT = null;
  function toast(text) {
    var t = $('toast');
    t.hidden = true; void t.offsetWidth;
    t.textContent = text; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2600);
  }

  // Home screen: a small board that keeps clearing itself while the player decides.
  var pv = { t: null, cycle: 0 };
  function stopPreview() { clearTimeout(pv.t); }
  function startPreview() {
    stopPreview();
    var g = generate(1 + (pv.cycle++ % 4));
    buildBoard($('pvBoard'), g, false);
    function step() {
      var free = g.items.filter(function (it) { return !it.gone && !firstBlocker(g, it); });
      if (!free.length) { pv.t = setTimeout(startPreview, 1100); return; }
      var it = free[0];
      it.gone = true;
      it.cells.forEach(function (p) { g.occ[p[0]][p[1]] = null; });
      launch(it, g);
      pv.t = setTimeout(step, reduceMotion ? 1200 : 520);
    }
    pv.t = setTimeout(step, 900);
  }

  function show(view) { $('home').hidden = view !== 'home'; $('game').hidden = view !== 'game'; }
  function play(lv) { stopPreview(); state.level = lv; show('game'); startLevel(); }
  function showHome() {
    closeModal();
    show('home');
    setAtmo(state.best);
    $('playBtn').textContent = state.best > 1 ? 'تابع المرحلة ' + state.best : 'ابدأ اللعب';
    var stars = 0, sv = loadStars();
    for (var k in sv) stars += sv[k];
    $('homeStats').innerHTML = '<span class="stat">المرحلة <b>' + state.best + '</b></span>' +
      '<span class="stat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + STAR + '"/></svg><b>' + stars + '</b> نجمة</span>';
    startPreview();
  }

  function levelPicker() {
    var grid = document.createElement('div');
    grid.className = 'lvgrid';
    var count = Math.max(12, Math.ceil(state.best / 4) * 4 + 4);
    function make(i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'lv' + (i === state.best ? ' cur' : '');
      b.innerHTML = '<span>' + i + '</span><small>' + starText(i) + '</small>';
      b.disabled = i > state.best;
      b.addEventListener('click', function () { closeModal(); goFull(); play(i); });
      grid.appendChild(b);
    }
    for (var i = 1; i <= count; i++) make(i);
    modal('المراحل', grid, [{ label: 'إغلاق', onClick: closeModal }]);
  }

  function howTo() {
    var ol = document.createElement('ol');
    ol.className = 'how';
    ['اضغط على سهم، فيخرج رأسه في اتجاه السهم والجسم يتبعه على نفس الخط حتى يغادر اللوحة.',
     'إذا كان في الخط أمام الرأس سهم آخر فلن يتحرك، وتخسر قلباً.',
     'كبّر اللوحة بإصبعين (أو بعجلة الفأرة) وحرّكها بإصبع واحد، ويعيد زر 1× الحجم الأصلي.',
     'أخرج كل الأسهم لتنهي المرحلة. زر التلميح يلوّن لك سهماً يمكن إخراجه الآن.'].forEach(function (t) {
      var li = document.createElement('li'); li.textContent = t; ol.appendChild(li);
    });
    modal('طريقة اللعب', ol, [{ label: 'فهمت', primary: true, onClick: closeModal }]);
  }

  // Fullscreen is requested from the Start tap. Some phones and in-app viewers refuse it, so the game also fills the whole viewport by layout.
  function fsSupported() { var el = document.documentElement; return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(el.requestFullscreen || el.webkitRequestFullscreen); }
  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function goFull() {
    try {
      if (!fsSupported() || isFull()) return;
      var el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen, r = f.call(el);
      if (r && r.catch) r.catch(function () {});
    } catch (e) {}
  }
  function leaveFull() {
    try {
      var x = document.exitFullscreen || document.webkitExitFullscreen;
      if (isFull() && x) { var r = x.call(document); if (r && r.catch) r.catch(function () {}); }
    } catch (e) {}
  }
  $('fsBtn').hidden = !fsSupported();
  $('fsBtn').addEventListener('click', function () { if (isFull()) leaveFull(); else goFull(); });

  $('playBtn').addEventListener('click', function () { goFull(); play(state.best); });
  $('levelsBtn').addEventListener('click', levelPicker);
  $('howBtn').addEventListener('click', howTo);
  $('homeBtn').addEventListener('click', showHome);
  $('shopBtn').addEventListener('click', shop);
  $('shopHomeBtn').addEventListener('click', shop);

  $('muteBtn').addEventListener('click', toggleMute);
  $('muteBtn2').addEventListener('click', toggleMute);
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('.btn, .iconbtn, .lv, .tcard')) sfx.click();
  });

  var savedTheme = store('arrowout.theme');
  var okTheme = THEMES.filter(function (t) { return t.id === savedTheme && isOwned(t); })[0];
  applyTheme(okTheme ? okTheme.id : 'classic');
  $('themesBtn').addEventListener('click', themeShop);
  $('coinsBtn').addEventListener('click', shop);
  $('coinsHome').addEventListener('click', shop);
  renderMute();
  renderCoins();
  showHome();
})();
</script>

</body></html>
